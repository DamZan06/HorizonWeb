<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HORIZON · Field Notes</title>
    <meta name="description" content="HORIZON field notes gallery: documentary images from the crossing.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/tokens.css?v=20260826a">
    <link rel="stylesheet" href="css/global.css?v=20260826a">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=20260715r">
    <link rel="icon" type="image/png" href="assets/favicon-v2.png?v=20260715r">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=20260715r">
</head>
<body data-page="gallery">
    <a href="#main" class="skip-link">Skip to main content</a>
    <header class="topbar">
        <a href="index.html" class="brand" aria-label="HORIZON home">
            <img src="assets/favicon-v2.png?v=20260715r" alt="HORIZON logo" class="brand-icon">
            <div>
                <span class="brand-title">HORIZON</span>
                <span class="brand-subtitle">Field Notes</span>
            </div>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="live.html">Live</a>
            <a href="project.html">Project</a>
            <a href="gallery.html" aria-current="page">Journey</a>
            <a href="replay.html">Replay</a>
        </nav>
    </header>
    <main id="main" class="page page-gallery">
        <section class="section">
            <div class="section-title gallery-title-row">
                <div>
                    <p class="eyebrow">Photographs</p>
                    <h1>Full journey gallery</h1>
                </div>
            </div>
            <div class="gallery-grid"></div>
        </section>
        <section class="section section-white">
            <div class="section-title">
                <p class="eyebrow">Photo map</p>
                <h2>Image locations.</h2>
                <p id="galleryPhotoMapStatus">Waiting for geolocated images...</p>
            </div>
            <div class="map-wrap map-wrap-photo-gallery">
                <div id="map"></div>
                <div class="map-actions">
                    <button id="galleryPhotoMapFullscreenBtn" type="button" class="map-toggle-btn" title="Open fullscreen map" aria-label="Open fullscreen map">&#x26F6;</button>
                </div>
            </div>
        </section>
    </main>
    <div class="modal-backdrop" role="dialog" aria-modal="true">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close">X</button>
            <button class="modal-nav modal-prev" id="modalPrev" aria-label="Previous image">《</button>
            <button class="modal-nav modal-next" id="modalNext" aria-label="Next image">》</button>
            <img id="modalImage" src="assets/preview.png" alt="">
            <div class="modal-details">
                <h3 id="modalTitle">Image title</h3>
                <p id="modalLocation">Location</p>
                <p id="modalDescription">Photo description and map position.</p>
            </div>
        </div>
    </div>
    <footer class="site-footer">
        <p>HORIZON © 2026 · Across Switzerland. East to west.</p>
    </footer>
    <script src="firebase-config.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="js/config.js?v=20260824a"></script>
    <script src="js/i18n.js?v=20260824a"></script>
    <script src="js/ui/navigation.js?v=20260824a"></script>
    <script src="js/status.js?v=20260824a"></script>
    <script src="js/app.js?v=20260824a"></script>
    <script src="js/pages/gallery.js?v=20260826a"></script>
</body>
</html>
