<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HORIZON · Expedition Replay</title>
    <meta name="description" content="Relive the HORIZON crossing with cinematic replay controls: play, pause, reset and speed control.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/tokens.css?v=20260826a">
    <link rel="stylesheet" href="css/global.css?v=20260826a">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo_horizon_homepage.png?v=20260827a">
    <link rel="icon" type="image/png" href="assets/logo_horizon_homepage.png?v=20260827a">
    <link rel="apple-touch-icon" href="assets/logo_horizon_homepage.png?v=20260827a">
</head>
<body data-page="replay">
    <a href="#main" class="skip-link">Skip to main content</a>
    <header class="topbar">
        <a href="index.html" class="brand" aria-label="HORIZON home">
            <img src="assets/logo_horizon_homepage.png?v=20260827a" alt="HORIZON logo" class="brand-icon">
            <div>
                <span class="brand-title">HORIZON</span>
                <span class="brand-subtitle">Replay</span>
            </div>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="live.html">Live</a>
            <a href="project.html">Project</a>
            <a href="gallery.html">Journey</a>
            <a href="replay.html" aria-current="page">Replay</a>
        </nav>
    </header>
    <main id="main" class="page page-replay">
        <section class="section">
            <div class="section-title">
                <p class="eyebrow">Replay</p>
                <h1>Relive the route.</h1>
                <p>Play the full crossing, pause it, accelerate the timeline and revisit the most significant moments.</p>
            </div>
            <div class="replay-controls">
                <div class="replay-button-row">
                    <button id="replayPlay" class="button primary">Play</button>
                    <button id="replayPause" class="button ghost">Pause</button>
                    <button id="replayReset" class="button secondary">Reset</button>
                </div>
                <div class="replay-speed-row">
                    <label for="replaySpeed">Speed:</label>
                    <input id="replaySpeed" type="range" min="20" max="500" step="20" value="80">
                    <span id="replaySpeedLabel">80 ms</span>
                    <span id="replayStatus">Replay ready</span>
                </div>
            </div>
            <div class="map-wrap">
                <div id="map"></div>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <p>HORIZON © 2026 · Across Switzerland. East to west.</p>
    </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/config.js?v=20260824a"></script>
    <script src="js/firebase.js?v=20260827a"></script>
    <script src="js/i18n.js?v=20260824a"></script>
    <script src="js/ui/navigation.js?v=20260824a"></script>
    <script src="js/status.js?v=20260824a"></script>
    <script src="js/stats.js?v=20260828a"></script>
    <script src="js/route.js?v=20260828a"></script>
    <script src="js/expedition.js?v=20260828a"></script>
    <script src="js/app.js?v=20260824a"></script>
    <script src="js/pages/replay.js?v=20260826a"></script>
</body>
</html>
