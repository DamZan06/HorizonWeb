<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HORIZON · Expedition Replay</title>
    <meta name="description" content="Relive the HORIZON crossing with cinematic replay controls: play, pause, reset and speed control.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://damzan06.github.io/HorizonWeb/assets/preview_link_horizon.png?v=20260827a"><meta property="og:image:secure_url" content="https://damzan06.github.io/HorizonWeb/assets/preview_link_horizon.png?v=20260827a"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://damzan06.github.io/HorizonWeb/assets/preview_link_horizon.png?v=20260827a">
    <link rel="stylesheet" href="css/tokens.css?v=20260828b">
    <link rel="stylesheet" href="css/global.css?v=20260828c">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo_horizon_homepage.png?v=20260827a">
    <link rel="icon" type="image/png" href="assets/logo_horizon_homepage.png?v=20260827a">
    <link rel="apple-touch-icon" href="assets/logo_horizon_homepage.png?v=20260827a">
</head>
<body data-page="replay">
    <a href="#main" class="skip-link">Skip to main content</a>
    <header class="topbar">
        <a href="index.html" class="brand" aria-label="HORIZON home">
            <img src="assets/logo_horizon_homepage.png?v=20260827a" alt="HORIZON logo" class="brand-icon">
            <div>
                <span class="brand-title">HORIZON</span>
                <span class="brand-subtitle">Replay</span>
            </div>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="live.html">Live</a>
            <a href="project.html">Project</a>
            <a href="gallery.html">Journey</a>
            <a href="replay.html" aria-current="page">Replay</a>
        </nav>
    </header>
    <main id="main" class="page page-replay">
        <section class="section">
            <div class="map-wrap">
                <div id="replayMapStatus" class="map-status" aria-live="polite">Loading replay map...</div>
                <div id="map"></div>
                <div class="map-actions" aria-label="Map controls">
                    <button id="replayPlay" class="map-toggle-btn replay-control-button primary" type="button" title="Start replay" aria-label="Start replay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"/></svg></button>
                    <button id="replayReset" class="map-toggle-btn replay-control-button" type="button" title="Restart replay" aria-label="Restart replay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-4.33 7.5l-1.73 1A7 7 0 1 0 12 5Z"/></svg></button>
                    <button id="replayMapZoomInBtn" type="button" class="map-toggle-btn" title="Zoom in" aria-label="Zoom in">+</button>
                    <button id="replayMapZoomOutBtn" type="button" class="map-toggle-btn" title="Zoom out" aria-label="Zoom out">&minus;</button>
                    <button id="replayMapCenterBtn" type="button" class="map-toggle-btn" title="Center on replay position" aria-label="Center on replay position"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.75a9.25 9.25 0 1 0 9.25 9.25A9.26 9.26 0 0 0 12 2.75Zm0 4.75a4.5 4.5 0 1 1-4.5 4.5A4.5 4.5 0 0 1 12 7.5Zm0 11.75a7.84 7.84 0 0 1-5.85-2.67A8.63 8.63 0 0 1 12 14.5a8.63 8.63 0 0 1 5.85 2.08A7.84 7.84 0 0 1 12 19.25Z"/></svg></button>
                    <button id="replayMapLayerBtn" type="button" class="map-toggle-btn" title="Change map layer" aria-label="Change map layer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Zm-7.1 8.2L12 15l7.1-3.8L21 12.3l-9 5-9-5 1.9-1.1Zm0 4L12 19l7.1-3.8 1.9 1.1-9 5-9-5 1.9-1.1Z"/></svg></button>
                    <button id="replayMapFullscreenBtn" type="button" class="map-toggle-btn" title="Open fullscreen map" aria-label="Open fullscreen map">&#x26F6;</button>
                </div>
                <div class="replay-map-speed">
                    <label for="replaySpeed">Speed</label>
                    <input id="replaySpeed" type="range" min="1" max="16" step="1" value="10">
                    <output id="replaySpeedLabel" for="replaySpeed">10x</output>
                </div>
                <span id="replayStatus" class="replay-status" aria-live="polite">Replay ready</span>
            </div>
            <p class="map-accessibility" aria-live="polite">Replay route map. Planned route, travelled track, start and finish markers are visible.</p>
        </section>
    </main>
    <footer class="site-footer">
        <p>HORIZON © 2026 · Across Switzerland. East to west.</p>
    </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/config.js?v=20260824a"></script>
    <script src="js/firebase.js?v=20260827a"></script>
    <script src="js/i18n.js?v=20260824a"></script>
    <script src="js/ui/navigation.js?v=20260824a"></script>
    <script src="js/status.js?v=20260824a"></script>
    <script src="js/stats.js?v=20260828b"></script>
    <script src="js/route.js?v=20260828a"></script>
    <script src="js/map.js?v=20260828h"></script>
    <script src="js/expedition.js?v=20260828b"></script>
    <script src="js/app.js?v=20260828c"></script>
    <script src="js/pages/replay.js?v=20260826a"></script>
</body>
</html>
